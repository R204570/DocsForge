  <script>
  (function () {
    // The server fills BASE_URL in from the request that asked for this page,
    // so a server you host serves this page already pointed at itself.
    var MCP = "{{BASE_URL}}/mcp";
    // The public site's own address, stamped at build. Its /mcp is a private
    // deployment, so the page never offers it as somewhere to connect to.
    var PUBLIC = "__SITE_URL__";
    var T = "__TOKEN__", U = "__URL__";
    var CMD = "docsforge-mcp";
    var PATH_HINT = " If the client says it cannot find docsforge-mcp, put its full path in \"command\" instead: run where docsforge-mcp on Windows, which docsforge-mcp on macOS and Linux.";
    var stdioJson = '{\n  "mcpServers": {\n    "docsforge": {\n      "command": "' + CMD + '"\n    }\n  }\n}';

    // On this machine: the client starts docsforge-mcp itself and talks to it
    // over stdio. No URL, no token.
    var LOCAL = {
      "claude-code": {
        title: "Claude Code", kind: "terminal",
        note: "One command. Scope defaults to the current project; add --scope user to have it everywhere.",
        text: "claude mcp add docsforge -- " + CMD
      },
      "codex": {
        title: "Codex CLI", kind: "terminal",
        note: "Codex starts the server itself whenever a session needs it.",
        text: "codex mcp add docsforge -- " + CMD
      },
      "chatgpt": {
        title: "ChatGPT", kind: "remote servers only", prose: true,
        note: "Every other client on this list can run DocsForge on your machine.",
        text: "ChatGPT connects only to MCP servers on the internet: it cannot start\na command on your machine. To use DocsForge from ChatGPT, host it on a\nserver with an https address, then pick \"On a server you host\" above."
      },
      "cursor": {
        title: "Cursor", kind: "~/.cursor/mcp.json",
        note: "Cursor Settings → MCP → Add new global MCP server opens this file; paste the block (merge into mcpServers if you already have one)." + PATH_HINT,
        text: stdioJson
      },
      "windsurf": {
        title: "Windsurf", kind: "~/.codeium/windsurf/mcp_config.json",
        note: "Cascade → MCP servers → Configure opens this file." + PATH_HINT,
        text: stdioJson
      },
      "antigravity": {
        title: "Antigravity", kind: "mcp_config.json",
        note: "Agent panel → ⋯ → MCP Servers → Manage → View raw config, paste, save." + PATH_HINT,
        text: stdioJson
      },
      "gemini": {
        title: "Gemini CLI", kind: "terminal",
        note: "Writes the server into ~/.gemini/settings.json for you.",
        text: "gemini mcp add docsforge " + CMD
      },
      "vscode": {
        title: "VS Code (Copilot agent mode)", kind: "terminal",
        note: "Registers the server in your user profile; VS Code asks to trust it the first time.",
        text: "code --add-mcp '{\"name\":\"docsforge\",\"command\":\"" + CMD + "\"}'"
      },
      "claude-desktop": {
        title: "Claude Desktop", kind: "claude_desktop_config.json",
        note: "Settings → Developer → Edit Config opens the file; restart Claude Desktop after saving." + PATH_HINT,
        text: stdioJson
      },
      "json": {
        title: "Any MCP client", kind: "JSON",
        note: "The common shape for a local server: a command the client starts and speaks to over stdio.",
        text: stdioJson
      }
    };

    // On a server you host: streamable HTTP, one URL, one bearer token.
    var HOSTED = {
      "claude-code": {
        title: "Claude Code", kind: "terminal",
        note: "One command. Scope defaults to the current project; add --scope user to have it everywhere.",
        text: 'claude mcp add --transport http docsforge ' + U + ' --header "Authorization: Bearer ' + T + '"'
      },
      "codex": {
        title: "Codex CLI", kind: "terminal",
        note: "Codex reads the token from an environment variable rather than the command line, so export it in the shell that launches codex (PowerShell: $env:DOCSFORGE_MCP_TOKEN = \"…\").",
        text: 'export DOCSFORGE_MCP_TOKEN=' + T + '\ncodex mcp add docsforge --url ' + U + ' --bearer-token-env-var DOCSFORGE_MCP_TOKEN'
      },
      "chatgpt": {
        title: "ChatGPT", kind: "Settings → Apps & Connectors (OAuth)",
        note: "Plus, Pro, Business, Enterprise or Edu, and a server with an https address. Profile → Settings → Apps & Connectors → Advanced settings → Developer Mode on → back in Apps & Connectors, Create → fill in the fields above, leave the OAuth endpoints alone (ChatGPT discovers them from the server) → Create. A DocsForge sign-in page opens: paste the server's token, Allow — once; ChatGPT keeps its own access token from then on. In a chat: + → Developer Mode → tick DocsForge. Reopen the chat after adding it so the tool list refreshes.",
        text: 'Name             DocsForge\nDescription      Documentation for technologies the model was not trained on\nMCP Server URL   ' + U + '\nAuthentication   OAuth\nRegistration     Dynamic Client Registration  (the default)\n\nSign-in page     paste ' + T + '  →  Allow'
      },
      "cursor": {
        title: "Cursor", kind: "~/.cursor/mcp.json",
        note: "Cursor Settings → MCP → Add new global MCP server opens this file; paste the block (merge into mcpServers if you already have one).",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "url": "' + U + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "windsurf": {
        title: "Windsurf", kind: "~/.codeium/windsurf/mcp_config.json",
        note: "Windsurf uses serverUrl, not url. Cascade → MCP servers → Configure opens this file.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "serverUrl": "' + U + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "antigravity": {
        title: "Antigravity", kind: "mcp_config.json",
        note: "Agent panel → ⋯ → MCP Servers → Manage → View raw config, paste, save. Same serverUrl shape as Windsurf.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "serverUrl": "' + U + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "gemini": {
        title: "Gemini CLI", kind: "terminal",
        note: "Writes the server into ~/.gemini/settings.json for you.",
        text: 'gemini mcp add --transport http docsforge ' + U + ' --header "Authorization: Bearer ' + T + '"'
      },
      "vscode": {
        title: "VS Code (Copilot agent mode)", kind: "terminal",
        note: "Registers the server in your user profile; VS Code asks to trust it the first time.",
        text: "code --add-mcp '{\"name\":\"docsforge\",\"type\":\"http\",\"url\":\"" + U + "\",\"headers\":{\"Authorization\":\"Bearer " + T + "\"}}'"
      },
      "claude-desktop": {
        title: "Claude Desktop", kind: "claude_desktop_config.json",
        note: "For a remote server Desktop needs a bridge: mcp-remote speaks stdio to Desktop and HTTP to the server. Settings → Developer → Edit Config opens the file; restart Claude Desktop after saving.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "command": "npx",\n      "args": ["-y", "mcp-remote", "' + U + '", "--header", "Authorization:${AUTH_HEADER}"],\n      "env": { "AUTH_HEADER": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "json": {
        title: "Any MCP client", kind: "JSON",
        note: "The common shape: a streamable-HTTP URL plus one header. Some clients name the key serverUrl or httpUrl instead of url.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "url": "' + U + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      }
    };

    var mode = "local", current = "claude-code";
    var modes = document.querySelectorAll("#mode-tabs .tab");
    var tabs = document.querySelectorAll("#client-tabs .tab");
    var serverEl = document.getElementById("server");
    var tokenEl = document.getElementById("token");
    var snippet = document.getElementById("snippet");
    var copy = document.getElementById("copy");
    var hostedRows = document.querySelectorAll(".hosted-only");

    // A server you host fills its own address in; the public site leaves the
    // field for yours.
    serverEl.value = MCP.indexOf(PUBLIC + "/") === 0 ? "" : MCP;

    function text() {
      var c = (mode === "local" ? LOCAL : HOSTED)[current];
      var tok = tokenEl.value.trim() || "<token>";
      var url = serverEl.value.trim() || "https://<your-server>/mcp";
      return c.text.split(T).join(tok).split(U).join(url);
    }
    function render() {
      var c = (mode === "local" ? LOCAL : HOSTED)[current];
      document.getElementById("snippet-title").textContent = c.title;
      document.getElementById("snippet-kind").textContent = c.kind;
      document.getElementById("snippet-note").textContent = c.note;
      snippet.textContent = text();
      copy.hidden = !!c.prose;
      hostedRows.forEach(function (row) { row.hidden = mode !== "hosted"; });
      [[modes, "data-mode", mode], [tabs, "data-client", current]].forEach(function (group) {
        group[0].forEach(function (b) {
          var on = b.getAttribute(group[1]) === group[2];
          b.classList.toggle("is-active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      });
      copy.textContent = "Copy";
    }
    modes.forEach(function (b) {
      b.addEventListener("click", function () { mode = b.getAttribute("data-mode"); render(); });
    });
    tabs.forEach(function (b) {
      b.addEventListener("click", function () { current = b.getAttribute("data-client"); render(); });
    });
    tokenEl.addEventListener("input", render);
    serverEl.addEventListener("input", render);
    document.getElementById("token-eye").addEventListener("click", function () {
      var hidden = tokenEl.type === "password";
      tokenEl.type = hidden ? "text" : "password";
      this.textContent = hidden ? "hide" : "show";
    });
    copy.addEventListener("click", function () {
      var value = text();
      var done = function () { copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done, function () { fallback(value); done(); });
      } else { fallback(value); done(); }
    });
    function fallback(value) {
      var ta = document.createElement("textarea");
      ta.value = value; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    // Deep links: /connect#cursor opens on that client, run locally;
    // /connect#hosted, or #hosted-cursor, on a server you host.
    var want = (location.hash || "").slice(1);
    if (want.indexOf("hosted") === 0) { mode = "hosted"; want = want.replace(/^hosted-?/, ""); }
    if (LOCAL[want]) current = want;
    render();
  })();
  </script>
