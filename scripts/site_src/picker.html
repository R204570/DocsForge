  <script>
  (function () {
    // The server fills BASE_URL in from the request that asked for this page.
    var MCP = "{{BASE_URL}}/mcp";
    var T = "__TOKEN__";
    var CLIENTS = {
      "claude-code": {
        title: "Claude Code", kind: "terminal",
        note: "One command. Scope defaults to the current project; add --scope user to have it everywhere.",
        text: 'claude mcp add --transport http docsforge ' + MCP + ' --header "Authorization: Bearer ' + T + '"'
      },
      "codex": {
        title: "Codex CLI", kind: "terminal",
        note: "Codex reads the token from an environment variable rather than the command line, so export it in the shell that launches codex (PowerShell: $env:DOCSFORGE_MCP_TOKEN = \"…\").",
        text: 'export DOCSFORGE_MCP_TOKEN=' + T + '\ncodex mcp add docsforge --url ' + MCP + ' --bearer-token-env-var DOCSFORGE_MCP_TOKEN'
      },
      "chatgpt": {
        title: "ChatGPT", kind: "Settings → Apps & Connectors (OAuth)",
        note: "Plus, Pro, Business, Enterprise or Edu. Profile → Settings → Apps & Connectors → Advanced settings → Developer Mode on → back in Apps & Connectors, Create → fill in the fields above, leave the OAuth endpoints alone (ChatGPT discovers them from the server) → Create. A DocsForge sign-in page opens: paste the server's token, Allow — once; ChatGPT keeps its own access token from then on. In a chat: + → Developer Mode → tick DocsForge. Reopen the chat after adding it so the tool list refreshes.",
        text: 'Name             DocsForge\nDescription      Documentation for technologies the model was not trained on\nMCP Server URL   ' + MCP + '\nAuthentication   OAuth\nRegistration     Dynamic Client Registration  (the default)\n\nSign-in page     paste ' + T + '  →  Allow'
      },
      "cursor": {
        title: "Cursor", kind: "~/.cursor/mcp.json",
        note: "Cursor Settings → MCP → Add new global MCP server opens this file; paste the block (merge into mcpServers if you already have one).",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "url": "' + MCP + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "windsurf": {
        title: "Windsurf", kind: "~/.codeium/windsurf/mcp_config.json",
        note: "Windsurf uses serverUrl, not url. Cascade → MCP servers → Configure opens this file.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "serverUrl": "' + MCP + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "antigravity": {
        title: "Antigravity", kind: "mcp_config.json",
        note: "Agent panel → ⋯ → MCP Servers → Manage → View raw config, paste, save. Same serverUrl shape as Windsurf.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "serverUrl": "' + MCP + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "gemini": {
        title: "Gemini CLI", kind: "terminal",
        note: "Writes the server into ~/.gemini/settings.json for you.",
        text: 'gemini mcp add --transport http docsforge ' + MCP + ' --header "Authorization: Bearer ' + T + '"'
      },
      "vscode": {
        title: "VS Code (Copilot agent mode)", kind: "terminal",
        note: "Registers the server in your user profile; VS Code asks to trust it the first time.",
        text: "code --add-mcp '{\"name\":\"docsforge\",\"type\":\"http\",\"url\":\"" + MCP + "\",\"headers\":{\"Authorization\":\"Bearer " + T + "\"}}'"
      },
      "claude-desktop": {
        title: "Claude Desktop", kind: "claude_desktop_config.json",
        note: "Desktop speaks stdio only, so mcp-remote bridges to the HTTP server. Settings → Developer → Edit Config opens the file; restart Claude Desktop after saving.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "command": "npx",\n      "args": ["-y", "mcp-remote", "' + MCP + '", "--header", "Authorization:${AUTH_HEADER}"],\n      "env": { "AUTH_HEADER": "Bearer ' + T + '" }\n    }\n  }\n}'
      },
      "json": {
        title: "Any MCP client", kind: "JSON",
        note: "The common shape: a streamable-HTTP URL plus one header. Some clients name the key serverUrl or httpUrl instead of url.",
        text: '{\n  "mcpServers": {\n    "docsforge": {\n      "url": "' + MCP + '",\n      "headers": { "Authorization": "Bearer ' + T + '" }\n    }\n  }\n}'
      }
    };
    var current = "claude-code";
    var tabs = document.querySelectorAll("#client-tabs .tab");
    var tokenEl = document.getElementById("token");
    var snippet = document.getElementById("snippet");
    var copy = document.getElementById("copy");

    function text() {
      var tok = tokenEl.value.trim() || "<token>";
      return CLIENTS[current].text.split(T).join(tok);
    }
    function render() {
      var c = CLIENTS[current];
      document.getElementById("snippet-title").textContent = c.title;
      document.getElementById("snippet-kind").textContent = c.kind;
      document.getElementById("snippet-note").textContent = c.note;
      snippet.textContent = text();
      tabs.forEach(function (b) {
        var on = b.getAttribute("data-client") === current;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      copy.textContent = "Copy";
    }
    tabs.forEach(function (b) {
      b.addEventListener("click", function () { current = b.getAttribute("data-client"); render(); });
    });
    tokenEl.addEventListener("input", render);
    document.getElementById("token-eye").addEventListener("click", function () {
      var hidden = tokenEl.type === "password";
      tokenEl.type = hidden ? "text" : "password";
      this.textContent = hidden ? "hide" : "show";
    });
    copy.addEventListener("click", function () {
      var value = text();
      var done = function () { copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done, function () { fallback(value); done(); });
      } else { fallback(value); done(); }
    });
    function fallback(value) {
      var ta = document.createElement("textarea");
      ta.value = value; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    // Deep link: /connect#cursor etc. opens on that client.
    var want = (location.hash || "").slice(1);
    if (CLIENTS[want]) current = want;
    render();
  })();
  </script>
