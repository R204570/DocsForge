<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocsStore — DocsForge</title>
<meta name="description" content="Every documentation set DocsForge has harvested, by technology and version.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cf9fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 7h18v13H3z'/%3E%3Cpath d='M8 4h8v3H8z'/%3E%3Cpath d='M3 12h18'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/store.css">
</head>
<body>
<!--
  DocsStore. Three levels, because documentation has three: a technology, every
  crawled version of it, and the pages of the version you open. Same charcoal
  and #CF9FFF as the chat; the accent marks the open thing and nothing else.
-->

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-forge" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M9 8h6M9 12h4"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 7h18v13H3z"/><path d="M8 4h8v3H8z"/><path d="M3 12h18"/></symbol>
  <symbol id="i-docs" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
  <symbol id="i-find" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/></symbol>
</svg>

<div class="side-scrim" id="side-scrim" aria-hidden="true"></div>

<aside class="side-nav" id="side-nav" data-open="false" aria-label="Sidebar">
  <div class="side-top">
    <button class="rail-btn" type="button" id="side-toggle"
            aria-expanded="false" aria-label="Open sidebar" title="Open sidebar">
      <svg class="icon"><use href="#i-panel"/></svg>
    </button>
    <a class="side-mark" href="/">DocsForge</a>
  </div>

  <nav class="side-links" aria-label="Sections">
    <button class="rail-btn" type="button" id="new-chat" title="New chat">
      <svg class="icon"><use href="#i-new"/></svg><span class="lbl">New chat</span>
    </button>
    <a class="rail-btn" href="/library" aria-current="page" title="DocsStore">
      <svg class="icon"><use href="#i-store"/></svg><span class="lbl">DocsStore</span>
    </a>
  </nav>

  <div class="side-body">
    <p class="side-head">Chats</p>
    <div class="chat-list" id="chat-list"></div>
  </div>

  <span class="rail-spacer"></span>

  <div class="side-foot">
    <a class="rail-btn" href="/docs" title="How this works">
      <svg class="icon"><use href="#i-docs"/></svg><span class="lbl">How it works</span>
    </a>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <span class="title">DocsStore</span>
    <span class="spacer"></span>
    <div class="acts" id="page-acts"></div>
    <!-- Where the harvest actually lives. Postgres ranks search and a folder
         of files cannot, so hiding which one answered would be a lie. -->
    <span class="pill flat" id="backend" title="Where the harvest is stored">reading…</span>
  </header>

  <div class="store">

    <aside class="side">
      <form class="find" id="find-form" role="search">
        <label class="sr" for="find-tech">Find a technology</label>
        <div class="find-field">
          <svg class="icon sm" aria-hidden="true"><use href="#i-find"/></svg>
          <input id="find-tech" type="search" spellcheck="false" autocomplete="off"
                 placeholder="Find a technology">
        </div>
      </form>

      <ol class="index" id="dividers" aria-busy="true">
        <li class="index-empty"><p class="dim">Loading…</p></li>
      </ol>

      <!-- The store grows with every harvest, so it is read a page at a time. -->
      <nav class="pager" id="pager" aria-label="Technology pages">
        <button class="ghost" type="button" data-page="prev" aria-label="Previous page">
          <svg class="icon sm"><use href="#i-back"/></svg>
        </button>
        <span class="pg-count" id="pg-count">—</span>
        <button class="ghost" type="button" data-page="next" aria-label="Next page">
          <svg class="icon sm"><use href="#i-arrow"/></svg>
        </button>
      </nav>
    </aside>

    <main class="stage" id="stage">
      <article class="card hollow">
        <header class="card-head"><h1 class="card-title">The box</h1></header>
        <div class="card-field">
          <div class="index-empty">
            <svg class="empty-art" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-store"/></svg>
            <p>Pick a technology.</p>
            <p class="dim">Each one holds every version of its documentation that has been crawled.</p>
          </div>
        </div>
      </article>
    </main>

  </div>
</main>

<script src="/static/sidebar.js"></script>
<script src="/static/library.js"></script>
</body>
</html>
