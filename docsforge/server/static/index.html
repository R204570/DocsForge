<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocsForge</title>
<meta name="description" content="Fetch any documentation into Markdown a language model can read.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cf9fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z'/%3E%3Cpath d='M9 8h6M9 12h4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!--
  A plain chat surface. Charcoal through black with one accent, #CF9FFF, spent
  only on the send control, the current selection, and links. The home screen
  explains nothing: every instruction lives at /docs.
-->

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-forge" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M9 8h6M9 12h4"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 7h18v13H3z"/><path d="M8 4h8v3H8z"/><path d="M3 12h18"/></symbol>
  <symbol id="i-docs" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-bang" viewBox="0 0 24 24"><path d="M12 7v6M12 16.5v.5"/><path d="M12 3l9 17H3z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M14.5 5.5l4 4"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10h-3"/><path d="M8 5L4 9l4 4"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/></symbol>
</svg>

<div class="side-scrim" id="side-scrim" aria-hidden="true"></div>

<aside class="side-nav" id="side-nav" data-open="false" aria-label="Sidebar">
  <div class="side-top">
    <button class="rail-btn" type="button" id="side-toggle"
            aria-expanded="false" aria-label="Open sidebar" title="Open sidebar">
      <svg class="icon"><use href="#i-panel"/></svg>
    </button>
    <a class="side-mark" href="/">DocsForge</a>
  </div>

  <nav class="side-links" aria-label="Sections">
    <button class="rail-btn" type="button" id="new-chat" title="New chat (Ctrl+N)">
      <svg class="icon"><use href="#i-new"/></svg><span class="lbl">New chat</span>
    </button>
    <a class="rail-btn" href="/library" title="DocsStore — everything harvested">
      <svg class="icon"><use href="#i-store"/></svg><span class="lbl">DocsStore</span>
    </a>
  </nav>

  <div class="side-body">
    <p class="side-head">Chats</p>
    <div class="chat-list" id="chat-list"></div>
  </div>

  <span class="rail-spacer"></span>

  <div class="side-foot">
    <a class="rail-btn" href="/docs" title="How this works">
      <svg class="icon"><use href="#i-docs"/></svg><span class="lbl">How it works</span>
    </a>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <span class="title" id="thread-title">New chat</span>
    <span class="spacer"></span>

    <!-- Which model answers. Switching is how you keep working when one
         provider runs out of quota, so it stays one click away. -->
    <div class="picker" id="picker" data-open="false">
      <button class="pill" type="button" id="model-chip"
              aria-haspopup="menu" aria-expanded="false">
        <span id="model-name">connecting…</span>
        <svg class="icon"><use href="#i-chev"/></svg>
      </button>
      <div class="menu" role="menu" id="model-menu"></div>
    </div>
  </header>

  <div class="thread" id="thread">
    <div class="thread-inner" id="turns"></div>
  </div>

  <div class="composer">
    <form class="composer-inner" id="ask-form">
      <div class="field">
        <label class="sr" for="input">Ask about documentation</label>
        <textarea id="input" rows="1" spellcheck="false"
                  placeholder="Ask anything"></textarea>
        <button class="round send" type="submit" id="send" aria-label="Send">
          <svg class="icon"><use href="#i-up"/></svg>
        </button>
      </div>
      <p class="foot" id="foot"></p>
    </form>
  </div>
</main>

<script src="/static/sidebar.js"></script>
<script src="/static/app.js"></script>
<script src="/static/harvests.js"></script>
</body>
</html>
